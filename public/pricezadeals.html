<!DOCTYPE html>
<html lang="th">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ศูนย์รวมดีลสินค้า B2S, OfficeMate & ประกันภัย Tune Protect | BestCyniX Dev</title>
  <meta name="description" content="ศูนย์รวมดีลสินค้าเครื่องเขียน อุปกรณ์ศิลปะ โต๊ะทำงาน เก้าอี้สุขภาพ B2S, OfficeMate และประกันภัยการเดินทาง" />
  <link rel="icon" type="image/png" href="assets/photo/bcxlogo2.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700;800&family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Core CSS -->
  <link rel="stylesheet" href="css/style.css?v=20260826_110" />
  <link rel="stylesheet" href="css/responsive-system.css?v=20260828_1" />

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=20260826_80"></script>

  
  <style>
    body {
      background: #030812;
      color: #e6f3ff;
      font-family: 'Prompt', sans-serif;
      overflow-x: hidden;
    }
    .deals-hero {
      padding: 6.5rem 0 2rem 0;
      text-align: center;
      position: relative;
    }
    .deals-hero-title {
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.8rem;
      font-family: 'Chakra Petch', sans-serif;
      text-shadow: 0 0 30px rgba(50, 255, 201, 0.2);
    }
    .deals-hero-desc {
      color: var(--muted, #8aa9c7);
      max-width: 720px;
      margin: 0 auto 2rem auto;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    .promo-banner-card {
      background: linear-gradient(145deg, rgba(16, 32, 54, 0.95), rgba(8, 18, 36, 0.98));
      border: 1px solid rgba(50, 255, 201, 0.35);
      border-radius: 22px;
      padding: 1.8rem 2.2rem;
      margin-bottom: 2.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }

    .cat-offers-scroll {
      display: flex;
      gap: 0.65rem;
      overflow-x: auto;
      padding: 0.5rem 0.2rem 1rem 0.2rem;
      scrollbar-width: thin;
      scrollbar-color: rgba(50, 255, 201, 0.3) transparent;
      margin-bottom: 2rem;
    }
    .cat-offer-chip {
      background: rgba(8, 20, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.6rem 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      white-space: nowrap;
      text-decoration: none;
      color: #d1e5f8;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .cat-offer-chip:hover {
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-2px);
    }

    /* Product Cards */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.4rem;
      margin-bottom: 3rem;
    }
    .product-clickable-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(160deg, rgba(8, 20, 38, 0.95), rgba(4, 12, 24, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 1.1rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .product-clickable-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
      border-color: var(--accent);
    }
    .prod-img-wrap {
      width: 100%;
      height: 170px;
      border-radius: 12px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
      margin-bottom: 1rem;
      position: relative;
    }
    .prod-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .product-clickable-card:hover .prod-img {
      transform: scale(1.05);
    }
    .prod-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 0.6rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 2.75rem;
    }
    .prod-shop-name {
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 0.6rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .prod-price-strip {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: auto;
      padding-top: 0.6rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .prod-price {
      font-size: 1.35rem;
      font-weight: 800;
      color: #32ffc9;
      font-family: 'Chakra Petch', sans-serif;
    }
    .prod-orig-price {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: line-through;
      margin-left: 0.3rem;
    }
    .prod-btn-action {
      margin-top: 0.8rem;
      padding: 0.6rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      color: #050b14;
      background: linear-gradient(135deg, var(--accent), #0284c7);
      transition: all 0.15s;
    }
    .product-clickable-card:hover .prod-btn-action {
      filter: brightness(1.15);
    }

    /* Controls */
    .deals-controls {
      background: rgba(8, 20, 38, 0.9);
      border: 1px solid rgba(50, 255, 201, 0.25);
      border-radius: 18px;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .search-input-wrap {
      flex: 1;
      min-width: 260px;
      position: relative;
    }
    .deals-search-input {
      width: 100%;
      background: rgba(4, 10, 22, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 0.65rem 1rem 0.65rem 2.6rem;
      border-radius: 10px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.9rem;
      outline: none;
    }
    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .filter-pills-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 2rem;
    }
    .filter-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
      padding: 0.4rem 0.95rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-pill.active, .filter-pill:hover {
      background: rgba(50, 255, 201, 0.15);
      border-color: var(--accent);
      color: #fff;
    }
  </style>

</head>
<body>
  <div class="particle-layer" aria-hidden="true"></div>
  
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="/" class="brand" style="text-decoration: none;">
        <img src="assets/photo/bcxlogo2.png" alt="BestCyniX Dev Logo" />
        <span>BestCyniX Dev</span>
      </a>
      <div style="display: flex; gap: 0.8rem; align-items: center;">
        <a href="/deals" class="btn-secondary" style="font-size: 0.85rem; padding: 0.45rem 0.9rem; text-decoration: none; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #fff;">
          <span>🛍️ รวมดีลทั้งหมด</span>
        </a>
        <a href="/" class="btn-secondary" style="font-size: 0.85rem; padding: 0.45rem 0.9rem; text-decoration: none; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); color: #fff;">
          <span>← หน้าหลัก</span>
        </a>
      </div>
    </div>
  </header>


  <main class="container">
    <section class="deals-hero">
      <div style="display:inline-flex; align-items:center; gap:0.5rem; background:rgba(234,179,8,0.15); border:1px solid rgba(234,179,8,0.4); color:#facc15; padding:0.35rem 1rem; border-radius:999px; font-size:0.82rem; font-weight:800; margin-bottom:1rem; font-family:'Chakra Petch', sans-serif;">
        <span>📚 B2S, OFFICEMATE & TUNE PROTECT DEALS</span>
      </div>
      <h1 class="deals-hero-title">ศูนย์รวมดีลสินค้า B2S, Office & ประกันภัย</h1>
      <p class="deals-hero-desc">
        คัดสรรอุปกรณ์ศิลปะ เครื่องเขียน โต๊ะทำงาน เก้าอี้สุขภาพ จาก B2S และ OfficeMate พร้อมประกันภัยการเดินทาง Tune Protect
      </p>
    </section>

    <!-- Search & Filter Controls -->
    <div class="deals-controls">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="pricezaSearchInput" class="deals-search-input" placeholder="ค้นหาชื่อสินค้า B2S, OfficeMate, หรือประกันภัย..." />
      </div>
      <div style="display:flex; gap:0.8rem; align-items:center; flex-wrap:wrap;">
        <select id="pricezaSortSelect" style="background:rgba(4,10,22,0.9); border:1px solid rgba(255,255,255,0.15); color:#fff; padding:0.6rem 1rem; border-radius:10px; font-family:'Prompt',sans-serif; font-size:0.85rem; outline:none; cursor:pointer;">
          <option value="featured">⭐ แนะนำ</option>
          <option value="price_asc">💵 ราคา: ต่ำไปสูง</option>
          <option value="price_desc">💎 ราคา: สูงไปต่ำ</option>
        </select>
        <select id="pricezaPageSizeSelect" style="background:rgba(4,10,22,0.9); border:1px solid rgba(255,255,255,0.15); color:#fff; padding:0.6rem 0.8rem; border-radius:10px; font-family:'Prompt',sans-serif; font-size:0.85rem; outline:none; cursor:pointer;">
          <option value="12">12 ชิ้น/หน้า</option>
          <option value="24" selected>24 ชิ้น/หน้า</option>
          <option value="all">ทั้งหมด</option>
        </select>
      </div>
    </div>

    <!-- Category Filter Pills -->
    <div class="filter-pills-bar" id="pricezaFilterPills">
      <button type="button" class="filter-pill active" data-cat="all">🌟 สินค้าทั้งหมด</button>
      <button type="button" class="filter-pill" data-cat="insurance">🛡️ ประกันภัยการเดินทาง</button>
      <button type="button" class="filter-pill" data-cat="stationery">🎨 เครื่องเขียน & สีศิลปะ B2S</button>
      <button type="button" class="filter-pill" data-cat="furniture">💺 โต๊ะ & เก้าอี้สุขภาพ OfficeMate</button>
      <button type="button" class="filter-pill" data-cat="computer">💻 อุปกรณ์คอมพิวเตอร์ & หูฟัง</button>
      <button type="button" class="filter-pill" data-cat="home">🏠 เครื่องใช้ในบ้าน</button>
      <button type="button" class="filter-pill" data-cat="books">📖 หนังสือ Bestseller</button>
    </div>

    <div style="font-size:0.86rem; color:var(--muted); margin-bottom:1.2rem;" id="pricezaCountLabel">
      กำลังโหลดรายการสินค้า...
    </div>

    <div class="products-grid" id="pricezaContainer"></div>

    <div style="display:flex; align-items:center; justify-content:center; gap:0.6rem; margin-bottom:4rem;" id="pricezaPaginationBar">
      <button type="button" class="btn-secondary" id="btnPricezaPrev" style="padding:0.45rem 1rem; font-weight:700; cursor:pointer; border-radius:8px;">&lt; ก่อนหน้า</button>
      <div style="background:rgba(0,0,0,0.5); border:1px solid var(--border); padding:0.35rem 0.8rem; border-radius:8px; font-family:'Chakra Petch',monospace; color:var(--accent); font-weight:700;">
        <span id="lblPricezaCurrentPage">1</span> / <span id="lblPricezaTotalPages">1</span>
      </div>
      <button type="button" class="btn-secondary" id="btnPricezaNext" style="padding:0.45rem 1rem; font-weight:700; cursor:pointer; border-radius:8px;">ถัดไป &gt;</button>
    </div>
  </main>

  <script src="js/shared-ui.js?v=20260826_99"></script>
  <script src="js/notifications.js?v=20260826_115"></script>
  <script src="js/affiliate.js?v=20260828_1"></script>
  <script>
    let pList = [];
    let curCat = 'all';
    let sQuery = '';
    let curSort = 'featured';
    let curPage = 1;
    let pSize = 24;

    const renderPriceza = () => {
      let filtered = window.BestCynixAffiliate
        ? window.BestCynixAffiliate.filter(pList)
        : [];

      if (curCat !== 'all') filtered = filtered.filter(p => p.category === curCat);
      if (sQuery.trim()) {
        const q = sQuery.toLowerCase();
        filtered = filtered.filter(p => (p.name && p.name.toLowerCase().includes(q)) || (p.shop && p.shop.toLowerCase().includes(q)));
      }

      if (curSort === 'price_asc') filtered.sort((a, b) => (a.rawPrice || 0) - (b.rawPrice || 0));
      if (curSort === 'price_desc') filtered.sort((a, b) => (b.rawPrice || 0) - (a.rawPrice || 0));

      const countEl = document.getElementById('pricezaCountLabel');
      if (countEl) countEl.textContent = `แสดงผล ${filtered.length} รายการ`;

      const container = document.getElementById('pricezaContainer');
      if (!container) return;

      if (filtered.length === 0) {
        container.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:3rem; color:var(--muted);">ยังไม่มีรายการ Priceza ที่ยืนยันลิงก์ Affiliate และค่าคอมมิชชั่นได้</div>';
        return;
      }

      const limit = pSize === 'all' ? filtered.length : parseInt(pSize);
      const totalPages = Math.ceil(filtered.length / limit) || 1;
      if (curPage > totalPages) curPage = totalPages;
      if (curPage < 1) curPage = 1;

      document.getElementById('lblPricezaCurrentPage').textContent = curPage;
      document.getElementById('lblPricezaTotalPages').textContent = totalPages;

      const start = (curPage - 1) * limit;
      const paged = pSize === 'all' ? filtered : filtered.slice(start, start + limit);

      container.innerHTML = paged.map(p => {
        const buyUrl = window.BestCynixAffiliate?.getPurchaseUrl(p) || '';
        if (!buyUrl) return '';
        return `
        <a href="${buyUrl}" target="_blank" rel="noopener sponsored" data-affiliate-id="${p.id || ''}" data-affiliate-platform="priceza" class="product-clickable-card" title="เปิดหน้า Affiliate ${p.name}">
          <div>
            <div class="prod-img-wrap">
              <img src="${p.image}" alt="${p.name}" class="prod-img" loading="lazy" />
              <span style="position:absolute; top:8px; left:8px; font-size:0.72rem; font-weight:800; padding:0.2rem 0.5rem; border-radius:6px; background:rgba(234,179,8,0.9); color:#050b14;">
                ${p.shop || 'Verified'}
              </span>
            </div>
            <div class="prod-shop-name">🏪 ${p.shop || 'Official Store'}</div>
            <h4 class="prod-title">${p.name}</h4>
          </div>

          <div>
            <div class="prod-price-strip">
              <div>
                <span class="prod-price">${p.price}</span>
                ${p.origPrice ? `<span class="prod-orig-price">${p.origPrice}</span>` : ''}
              </div>
              ${p.discount ? `<span style="background:rgba(239,68,68,0.15);color:#f87171;padding:0.15rem 0.4rem;border-radius:4px;font-size:0.7rem;font-weight:700;">-${p.discount}</span>` : ''}
            </div>
            <div class="prod-btn-action" style="background:linear-gradient(135deg, #eab308, #ca8a04); color:#050b14;">
              <span>🛒 ดูข้อเสนอนี้ ↗</span>
            </div>
          </div>
        </a>
      `;}).join('');
      window.BestCynixAffiliate?.attachClickTracking(container);
    };

    fetch('data/priceza-products.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => {
        pList = data.products || [];
        renderPriceza();
      });

    document.getElementById('pricezaSearchInput')?.addEventListener('input', (e) => {
      sQuery = e.target.value;
      curPage = 1;
      renderPriceza();
    });
    document.getElementById('pricezaSortSelect')?.addEventListener('change', (e) => {
      curSort = e.target.value;
      curPage = 1;
      renderPriceza();
    });
    document.getElementById('pricezaPageSizeSelect')?.addEventListener('change', (e) => {
      pSize = e.target.value;
      curPage = 1;
      renderPriceza();
    });
    document.getElementById('btnPricezaPrev')?.addEventListener('click', () => {
      if (curPage > 1) { curPage--; renderPriceza(); window.scrollTo({ top: document.getElementById('pricezaContainer').offsetTop - 120, behavior: 'smooth' }); }
    });
    document.getElementById('btnPricezaNext')?.addEventListener('click', () => {
      const limit = pSize === 'all' ? pList.length : parseInt(pSize);
      const totalPages = Math.ceil(pList.length / limit) || 1;
      if (curPage < totalPages) { curPage++; renderPriceza(); window.scrollTo({ top: document.getElementById('pricezaContainer').offsetTop - 120, behavior: 'smooth' }); }
    });
    document.querySelectorAll('#pricezaFilterPills .filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#pricezaFilterPills .filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        curCat = btn.getAttribute('data-cat') || 'all';
        curPage = 1;
        renderPriceza();
      });
    });
  </script>
</body>
</html>
