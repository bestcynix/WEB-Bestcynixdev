name: BestCyniX status monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger server-backed status probe
        run: curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error 'https://web-bestcynixdev.vercel.app/api/status?run=1'
